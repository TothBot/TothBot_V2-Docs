<svg viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="760" fill="#FFFFFF"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Diagram 2 — TothBot Trading Pipeline</text>
  <text x="410" y="50" text-anchor="middle" font-size="11" fill="#555">Fires on every 5-minute OHLC candle close event — synchronous, event-driven</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#424242"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C62828"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E7D32"/>
    </marker>
  </defs>

  <!-- TRIGGER -->
  <rect x="285" y="65" width="250" height="42" rx="20" fill="#1565C0" stroke="#1565C0"/>
  <text x="410" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">OHLC 5-min Candle Close</text>
  <text x="410" y="98" text-anchor="middle" font-size="10" fill="#CFD8DC">Public WS v2 push event — system clock</text>
  <line x1="410" y1="107" x2="410" y2="125" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 1 -->
  <rect x="270" y="125" width="280" height="52" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="410" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">GATE 1 — State Machine</text>
  <text x="410" y="163" text-anchor="middle" font-size="10" fill="#333">Block if engine = maintenance or cancel_only</text>
  <text x="560" y="157" font-size="10" fill="#C62828">▶ HALT if blocked · wait</text>
  <line x1="550" y1="152" x2="560" y2="152" stroke="#C62828" stroke-width="1.5"/>
  <line x1="410" y1="177" x2="410" y2="195" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 2 -->
  <rect x="270" y="195" width="280" height="52" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="380" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">GATE 2 — Liquidity Gate</text>
  <text x="390" y="214" font-size="10" fill="#2E7D32" font-weight="bold"> ★NEW</text>
  <text x="410" y="233" text-anchor="middle" font-size="10" fill="#333">24h volume ≥ $500k USD (CIATS-owned)</text>
  <text x="560" y="227" font-size="10" fill="#C62828">▶ SKIP signal</text>
  <line x1="550" y1="222" x2="560" y2="222" stroke="#C62828" stroke-width="1.5"/>
  <line x1="410" y1="247" x2="410" y2="265" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 3 -->
  <rect x="270" y="265" width="280" height="52" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="380" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">GATE 3 — 1H HTF Confirmation</text>
  <text x="390" y="284" font-size="10" fill="#2E7D32" font-weight="bold"> ★NEW</text>
  <text x="410" y="303" text-anchor="middle" font-size="10" fill="#333">1H EMA(20) &gt; EMA(50) for TRENDING_POS entries</text>
  <text x="560" y="298" font-size="10" fill="#C62828">▶ HTF_GATE_REJECTED</text>
  <line x1="550" y1="292" x2="560" y2="292" stroke="#C62828" stroke-width="1.5"/>
  <line x1="410" y1="317" x2="410" y2="335" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SIGNAL ENGINE -->
  <rect x="270" y="335" width="280" height="42" rx="6" fill="#FFF8E1" stroke="#F57F17" stroke-width="2"/>
  <text x="410" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#F57F17">SSS Signal Engine</text>
  <text x="410" y="370" text-anchor="middle" font-size="10" fill="#333">Score computed on 5-min candle data</text>
  <line x1="410" y1="377" x2="410" y2="395" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 4 -->
  <rect x="270" y="395" width="280" height="52" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="410" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">GATE 4 — Selection Controller</text>
  <text x="410" y="433" text-anchor="middle" font-size="10" fill="#333">6-gate quality evaluation (OI-005)</text>
  <text x="560" y="427" font-size="10" fill="#C62828">▶ REJECTED + reason code</text>
  <line x1="550" y1="422" x2="560" y2="422" stroke="#C62828" stroke-width="1.5"/>
  <line x1="410" y1="447" x2="410" y2="465" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 5 -->
  <rect x="270" y="465" width="280" height="52" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="380" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">GATE 5 — Regime Gate</text>
  <text x="390" y="484" font-size="10" fill="#2E7D32" font-weight="bold"> ★NEW</text>
  <text x="410" y="503" text-anchor="middle" font-size="10" fill="#333">NON_DIR+ELEV / TRENDING_NEG → NO ENTRY</text>
  <text x="560" y="497" font-size="10" fill="#C62828">▶ REGIME_BLOCKED</text>
  <line x1="550" y1="492" x2="560" y2="492" stroke="#C62828" stroke-width="1.5"/>
  <line x1="410" y1="517" x2="410" y2="535" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 6 -->
  <rect x="270" y="535" width="280" height="52" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="410" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">GATE 6 — Risk Guard</text>
  <text x="410" y="573" text-anchor="middle" font-size="10" fill="#333">Drawdown halt · concentration · exposure</text>
  <text x="560" y="567" font-size="10" fill="#C62828">▶ RISK_BLOCKED</text>
  <line x1="550" y1="562" x2="560" y2="562" stroke="#C62828" stroke-width="1.5"/>
  <line x1="410" y1="587" x2="410" y2="605" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 7 - Position Sizer -->
  <rect x="270" y="605" width="280" height="52" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="380" y="624" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">GATE 7 — Position Sizer</text>
  <text x="390" y="624" font-size="10" fill="#2E7D32" font-weight="bold"> ★UPDATED</text>
  <text x="410" y="643" text-anchor="middle" font-size="10" fill="#333">MAE = ATR(14)×1.5x  ·  emergSL = ATR(14)×3.0x</text>
  <text x="560" y="637" font-size="10" fill="#555">Never blocks — only sizes</text>
  <line x1="410" y1="657" x2="410" y2="675" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ORDER -->
  <rect x="270" y="675" width="280" height="65" rx="6" fill="#2E7D32"/>
  <text x="410" y="696" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">ORDER DISPATCH</text>
  <text x="410" y="714" text-anchor="middle" font-size="10" fill="#C8E6C9">add_order: limit · post_only · GTD</text>
  <text x="410" y="730" text-anchor="middle" font-size="10" fill="#C8E6C9">expiretm = now + 30–60s (CIATS-owned)</text>

  <!-- On Fill note -->
  <rect x="130" y="675" width="130" height="65" rx="6" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="195" y="696" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">ON FILL:</text>
  <text x="195" y="713" text-anchor="middle" font-size="10" fill="#333">batch_add (atomic)</text>
  <text x="195" y="729" text-anchor="middle" font-size="10" fill="#333">TP resting limit</text>
  <text x="195" y="745" text-anchor="middle" font-size="10" fill="#333">+ emergSL stop-mkt</text>
  <line x1="270" y1="707" x2="260" y2="707" stroke="#C62828" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- NON_DIR 50% note -->
  <rect x="560" y="465" width="190" height="52" rx="4" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="655" y="484" text-anchor="middle" font-size="10" font-weight="bold" fill="#F57F17">NON_DIR + NORMAL_VOL:</text>
  <text x="655" y="501" text-anchor="middle" font-size="10" fill="#333">50% position size</text>
  <text x="655" y="516" text-anchor="middle" font-size="9" fill="#555">(CIATS-owned threshold)</text>

  <!-- Reject log note -->
  <rect x="560" y="535" width="190" height="52" rx="4" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="655" y="554" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">ALL REJECTS LOGGED</text>
  <text x="655" y="571" text-anchor="middle" font-size="10" fill="#333">With reason code</text>
  <text x="655" y="587" text-anchor="middle" font-size="9" fill="#555">CIATS EWMA monitors rejection rate</text>

  <!-- Evidence base box -->
  <rect x="30" y="265" width="230" height="95" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="145" y="283" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">EVIDENCE BASE</text>
  <text x="40" y="300" font-size="9" fill="#333">★ 1H HTF Gate: 15-20% higher win rate</text>
  <text x="50" y="314" font-size="9" fill="#555">(5 independent sources 2024-2025)</text>
  <text x="40" y="330" font-size="9" fill="#333">★ Regime Gate: accuracy 65%→45-50%</text>
  <text x="50" y="344" font-size="9" fill="#555">in NON_DIRECTIONAL (Market Cipher)</text>
  <text x="40" y="358" font-size="9" fill="#555">Break-even: 40% for 1:1.5 R:R</text>
</svg>
