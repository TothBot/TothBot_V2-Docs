<svg width="820" height="780" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#444"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#C62828"/>
    </marker>
  </defs>
  <rect width="820" height="780" fill="#fff"/>
  <rect x="10" y="8" width="800" height="30" rx="4" fill="#1F3864"/>
  <text x="410" y="29" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">DIAGRAM 2 — TOTHBOT TRADING PIPELINE (All 6 FP/DP Improvements Applied)</text>

  <!-- Trigger -->
  <rect x="260" y="50" width="300" height="38" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="410" y="64" text-anchor="middle" fill="#0D47A1" font-size="11" font-weight="bold">TRIGGER: OHLC 5-min candle close event</text>
  <text x="410" y="80" text-anchor="middle" fill="#0D47A1" font-size="10">Public WS v2 push — fires on trade events, not wall clock</text>

  <!-- Gates 1-6 + Sizer -->
  <!-- Gate 1 -->
  <rect x="260" y="103" width="300" height="38" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="410" y="118" text-anchor="middle" fill="#B71C1C" font-size="11" font-weight="bold">GATE 1: STATE MACHINE</text>
  <text x="410" y="133" text-anchor="middle" fill="#B71C1C" font-size="10">Block on maintenance or cancel_only — wait for online/post_only</text>

  <!-- Gate 2 -->
  <rect x="260" y="156" width="300" height="38" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="410" y="171" text-anchor="middle" fill="#BF360C" font-size="11" font-weight="bold">GATE 2: LIQUIDITY GATE ★ NEW</text>
  <text x="410" y="186" text-anchor="middle" fill="#BF360C" font-size="10">24h volume &lt; $500k USD → SKIP (CIATS-owned threshold)</text>

  <!-- Gate 3 -->
  <rect x="260" y="209" width="300" height="38" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="410" y="224" text-anchor="middle" fill="#1B5E20" font-size="11" font-weight="bold">GATE 3: 1H HTF CONFIRMATION ★ NEW</text>
  <text x="410" y="239" text-anchor="middle" fill="#1B5E20" font-size="10">TRENDING_POS only: 1H EMA(20) &gt; EMA(50) required</text>

  <!-- SSS Signal -->
  <rect x="260" y="262" width="300" height="38" rx="4" fill="#E8EAF6" stroke="#3949AB" stroke-width="2"/>
  <text x="410" y="277" text-anchor="middle" fill="#1A237E" font-size="11" font-weight="bold">SSS SIGNAL ENGINE</text>
  <text x="410" y="292" text-anchor="middle" fill="#1A237E" font-size="10">Score 5-min candle (OI-001 — full spec TBD in 0711001)</text>

  <!-- Gate 4 -->
  <rect x="260" y="315" width="300" height="38" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="410" y="330" text-anchor="middle" fill="#4A148C" font-size="11" font-weight="bold">GATE 4: SELECTION CONTROLLER</text>
  <text x="410" y="345" text-anchor="middle" fill="#4A148C" font-size="10">6-gate quality evaluation (OI-005 — full spec TBD in 0811002)</text>

  <!-- Gate 5 -->
  <rect x="260" y="368" width="300" height="38" rx="4" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="410" y="383" text-anchor="middle" fill="#E65100" font-size="11" font-weight="bold">GATE 5: REGIME GATE ★ NEW</text>
  <text x="410" y="398" text-anchor="middle" fill="#E65100" font-size="10">NON_DIR+ELEV, TRENDING_NEG → NO ENTRY | NON_DIR+NORM → 50% size</text>

  <!-- Gate 6 -->
  <rect x="260" y="421" width="300" height="38" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1.5"/>
  <text x="410" y="436" text-anchor="middle" fill="#880E4F" font-size="11" font-weight="bold">GATE 6: RISK GUARD</text>
  <text x="410" y="451" text-anchor="middle" fill="#880E4F" font-size="10">Drawdown halt | concentration | exposure limits</text>

  <!-- Position Sizer -->
  <rect x="260" y="474" width="300" height="38" rx="4" fill="#E0F7FA" stroke="#006064" stroke-width="2"/>
  <text x="410" y="489" text-anchor="middle" fill="#004D40" font-size="11" font-weight="bold">GATE 7: POSITION SIZER ★ UPDATED</text>
  <text x="410" y="504" text-anchor="middle" fill="#004D40" font-size="10">ATR(14)×1.5x MAE | ATR(14)×3.0x emergSL | R:R formula</text>

  <!-- Order Dispatch -->
  <rect x="210" y="527" width="400" height="55" rx="4" fill="#1F3864" stroke="#0D47A1" stroke-width="2"/>
  <text x="410" y="545" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">EXECUTION: WS add_order</text>
  <text x="410" y="561" text-anchor="middle" fill="#fff" font-size="10">limit | post_only=true | GTD expiretm=now+30-60s</text>
  <text x="410" y="574" text-anchor="middle" fill="#FFF176" font-size="10">req_id ★ | cl_ord_id ★(A-2) | stp_type:cancel-newest ★(A-4)</text>

  <!-- Two paths -->
  <!-- Expired/Rejected -->
  <rect x="30" y="610" width="215" height="50" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="137" y="630" text-anchor="middle" fill="#B71C1C" font-size="10" font-weight="bold">EXPIRED / REJECTED</text>
  <text x="137" y="646" text-anchor="middle" fill="#B71C1C" font-size="10">Log reason code → CIATS EWMA</text>
  <text x="137" y="662" text-anchor="middle" fill="#B71C1C" font-size="10">monitors rejection_rate_by_regime (F6)</text>

  <!-- Filled -->
  <rect x="575" y="610" width="215" height="50" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="682" y="630" text-anchor="middle" fill="#1B5E20" font-size="10" font-weight="bold">FILLED</text>
  <text x="682" y="646" text-anchor="middle" fill="#1B5E20" font-size="10">WS batch_add (atomic): TP resting limit</text>
  <text x="682" y="662" text-anchor="middle" fill="#1B5E20" font-size="10">+ emergSL stop-market | OTO REJECTED</text>

  <!-- Position Mirror -->
  <rect x="260" y="685" width="300" height="38" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="410" y="700" text-anchor="middle" fill="#0D47A1" font-size="11" font-weight="bold">POSITION MIRROR</text>
  <text x="410" y="716" text-anchor="middle" fill="#0D47A1" font-size="10">symbol | entry | qty | TP order_id | cl_ord_id | SL order_id</text>

  <!-- Arrows -->
  <line x1="410" y1="88" x2="410" y2="103" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="141" x2="410" y2="156" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="194" x2="410" y2="209" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="247" x2="410" y2="262" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="300" x2="410" y2="315" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="353" x2="410" y2="368" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="406" x2="410" y2="421" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="459" x2="410" y2="474" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="512" x2="410" y2="527" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- split to two outcomes -->
  <line x1="210" y1="554" x2="137" y2="554" stroke="#C62828" stroke-width="1.5"/>
  <line x1="137" y1="554" x2="137" y2="610" stroke="#C62828" stroke-width="1.5" marker-end="url(#arb)"/>
  <line x1="610" y1="554" x2="682" y2="554" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="682" y1="554" x2="682" y2="610" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="682" y1="660" x2="410" y2="660" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="410" y1="660" x2="410" y2="685" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Reject paths from gates -->
  <text x="570" y="122" fill="#C62828" font-size="9">SKIP → log HTF_GATE_BLOCKED</text>
  <text x="570" y="175" fill="#C62828" font-size="9">SKIP → log LIQUIDITY_REJECTED</text>
  <text x="570" y="228" fill="#C62828" font-size="9">SKIP → log HTF_GATE_REJECTED</text>
  <text x="570" y="334" fill="#C62828" font-size="9">SKIP → log SELECTION_REJECTED</text>
  <text x="570" y="387" fill="#C62828" font-size="9">SKIP → log REGIME_GATE_BLOCKED</text>
  <text x="570" y="440" fill="#C62828" font-size="9">HALT → log RISK_GUARD_HALT</text>

  <rect x="685" y="748" width="125" height="22" rx="3" fill="#1F3864"/>
  <text x="747" y="763" text-anchor="middle" fill="#fff" font-size="10">0500000 dv1_4 ★</text>
</svg>