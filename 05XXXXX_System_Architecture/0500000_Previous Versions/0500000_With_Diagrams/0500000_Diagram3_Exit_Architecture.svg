    <path d="M0,0 L0,6 L8,3 z" fill="#404040"/>
  </marker>
  <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#1E6B1E"/>
