<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="620" fill="#FFFFFF"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Diagram 1 — Kraken API Connection Architecture</text>

  <!-- TOTHBOT box -->
  <rect x="330" y="220" width="240" height="180" rx="6" fill="#E8F4E8" stroke="#2E7D32" stroke-width="2"/>
  <text x="450" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">TOTHBOT</text>
  <text x="450" y="263" text-anchor="middle" font-size="11" fill="#333">(Python 3.12.3 · VPS)</text>
  <text x="346" y="287" font-size="10" fill="#333">· WS Manager</text>
  <text x="346" y="303" font-size="10" fill="#333">· Signal Pipeline</text>
  <text x="346" y="319" font-size="10" fill="#333">· Exit Controller</text>
  <text x="346" y="335" font-size="10" fill="#333">· Execution Engine</text>
  <text x="346" y="351" font-size="10" fill="#333">· Logger → CIATS</text>
  <text x="346" y="367" font-size="10" fill="#333">· Position Mirror</text>
  <text x="346" y="385" font-size="10" fill="#333">· Risk Guard</text>

  <!-- PUBLIC WS v2 box -->
  <rect x="30" y="55" width="220" height="175" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="140" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">PUBLIC WS v2</text>
  <text x="140" y="95" text-anchor="middle" font-size="10" fill="#555">wss://ws.kraken.com/v2</text>
  <rect x="45" y="106" width="190" height="22" rx="3" fill="#BBDEFB"/>
  <text x="140" y="121" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">ohlc(5m) — SYSTEM CLOCK</text>
  <text x="46" y="144" font-size="10" fill="#333">· instrument  (asset specs, qty_min)</text>
  <text x="46" y="160" font-size="10" fill="#333">· status        (engine state — gate 1)</text>
  <text x="46" y="176" font-size="10" fill="#333">· ticker          (bid/ask/last price)</text>
  <text x="46" y="205" font-size="10" fill="#888">4 subscriptions — read-only</text>

  <!-- PRIVATE WS v2 box -->
  <rect x="30" y="260" width="220" height="185" rx="6" fill="#EDE7F6" stroke="#6A1B9A" stroke-width="2"/>
  <text x="140" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">PRIVATE WS v2</text>
  <text x="140" y="300" text-anchor="middle" font-size="10" fill="#555">wss://ws-auth.kraken.com/v2</text>
  <text x="46" y="320" font-size="10" font-weight="bold" fill="#6A1B9A">INBOUND:</text>
  <text x="46" y="337" font-size="10" fill="#333">· executions  (fills/expiry/SL-TP)</text>
  <text x="70" y="352" font-size="9" fill="#555">  ratecounter:true enabled (A-1)</text>
  <text x="46" y="368" font-size="10" fill="#333">· balances     (real-time settlement)</text>
  <text x="46" y="388" font-size="10" font-weight="bold" fill="#6A1B9A">OUTBOUND (all carry req_id):</text>
  <text x="46" y="405" font-size="10" fill="#333">· add_order  · batch_add  · cancel_order</text>
  <text x="46" y="430" font-size="9" fill="#888">req_id registry in WS Manager (A-2)</text>

  <!-- REST box -->
  <rect x="30" y="468" width="220" height="130" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="140" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">REST API</text>
  <text x="140" y="507" text-anchor="middle" font-size="10" fill="#555">Startup + Emergency ONLY</text>
  <text x="46" y="527" font-size="10" fill="#333">· GetWebSocketsToken  (startup/reconnect)</text>
  <text x="46" y="543" font-size="10" fill="#333">· GetOpenOrders          (restart reconcile)</text>
  <text x="46" y="559" font-size="10" fill="#333">· GetAccountBalance   (restart reconcile)</text>
  <text x="46" y="575" font-size="10" fill="#333">· CancelAllOrders        (kill switch only)</text>

  <!-- MATCHING ENGINE box -->
  <rect x="640" y="55" width="230" height="130" rx="6" fill="#FCE4EC" stroke="#C62828" stroke-width="2"/>
  <text x="755" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">MATCHING ENGINE</text>
  <text x="755" y="97" text-anchor="middle" font-size="10" fill="#555">Kraken — always active</text>
  <rect x="655" y="106" width="200" height="22" rx="3" fill="#FFCDD2"/>
  <text x="755" y="121" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">CRASH PROTECTION</text>
  <text x="656" y="142" font-size="10" fill="#333">· Resting TP limit orders</text>
  <text x="656" y="158" font-size="10" fill="#333">· Off-book emergency SL stop orders</text>
  <text x="656" y="174" font-size="10" fill="#555">Survive any TothBot/VPS failure</text>

  <!-- KRAKEN ENGINE STATE box -->
  <rect x="640" y="210" width="230" height="130" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="755" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">ENGINE STATES</text>
  <text x="656" y="255" font-size="10" fill="#333"><tspan font-weight="bold">online</tspan>      — All orders, normal operation</text>
  <text x="656" y="272" font-size="10" fill="#333"><tspan font-weight="bold">post_only</tspan>  — Limit+post_only valid</text>
  <text x="656" y="289" font-size="10" fill="#333"><tspan font-weight="bold">cancel_only</tspan> — No entries, cancels ok</text>
  <text x="656" y="306" font-size="10" fill="#333"><tspan font-weight="bold">maintenance</tspan> — Nothing, SL/TP active</text>
  <text x="755" y="330" text-anchor="middle" font-size="9" fill="#888">Gate 1 (State Machine) reads status channel</text>

  <!-- API KEYS box -->
  <rect x="640" y="365" width="230" height="85" rx="6" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="755" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">API KEY PAIRS</text>
  <text x="656" y="408" font-size="10" fill="#333">DATA key — market data subscriptions</text>
  <text x="656" y="425" font-size="10" fill="#333">TRADE key — orders + WS auth token</text>
  <text x="656" y="442" font-size="9" fill="#555">Nonce window: 10,000ms on both keys</text>

  <!-- CONSTRAINTS box -->
  <rect x="640" y="470" width="230" height="128" rx="6" fill="#FFFDE7" stroke="#F57F17" stroke-width="2"/>
  <text x="755" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#F57F17">CONSTRAINTS</text>
  <text x="656" y="512" font-size="10" fill="#333">· Cloudflare: 150 reconnects / 10min / IP</text>
  <text x="656" y="528" font-size="10" fill="#333">· Post-maintenance: 5s min delay</text>
  <text x="656" y="544" font-size="10" fill="#333">· WS keepalive: ping req (~60s timeout)</text>
  <text x="656" y="560" font-size="10" fill="#333">· Fresh token on every reconnect</text>
  <text x="656" y="576" font-size="10" fill="#333">· Rate threshold: 125/pair, decay 2.34/s</text>
  <text x="656" y="592" font-size="10" fill="#333">· Max 80 open orders/pair</text>

  <!-- Arrows: Public WS → TothBot -->
  <line x1="250" y1="142" x2="330" y2="280" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <!-- Arrows: Private WS ↔ TothBot -->
  <line x1="250" y1="340" x2="330" y2="340" stroke="#6A1B9A" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="330" y1="360" x2="250" y2="380" stroke="#6A1B9A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <!-- REST → TothBot -->
  <line x1="250" y1="510" x2="330" y2="390" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <!-- TothBot → Matching Engine -->
  <line x1="570" y1="270" x2="640" y2="130" stroke="#C62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="598" y="218" font-size="9" fill="#C62828" transform="rotate(-38, 598, 218)">batch_add TP+SL</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565C0"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6A1B9A"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E65100"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C62828"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="330" y="55" width="240" height="130" rx="6" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
  <text x="450" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">LEGEND</text>
  <rect x="345" y="83" width="12" height="12" fill="#E3F0FB" stroke="#1565C0"/>
  <text x="362" y="94" font-size="10" fill="#333">Public WS v2 (read-only market data)</text>
  <rect x="345" y="100" width="12" height="12" fill="#EDE7F6" stroke="#6A1B9A"/>
  <text x="362" y="111" font-size="10" fill="#333">Private WS v2 (orders + execution)</text>
  <rect x="345" y="117" width="12" height="12" fill="#FFF3E0" stroke="#E65100"/>
  <text x="362" y="128" font-size="10" fill="#333">REST (startup + emergency only)</text>
  <rect x="345" y="134" width="12" height="12" fill="#FCE4EC" stroke="#C62828"/>
  <text x="362" y="145" font-size="10" fill="#333">Matching Engine (crash protection)</text>
  <text x="345" y="166" font-size="9" fill="#555">★ A-1/A-2/A-3 = zero-cost operational requirements (dv1_2)</text>
</svg>
