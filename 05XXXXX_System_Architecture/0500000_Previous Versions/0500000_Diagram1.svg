<svg width="900" height="640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fff"/>
  <!-- Title -->
  <rect x="10" y="8" width="880" height="30" rx="4" fill="#1F3864"/>
  <text x="450" y="29" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">DIAGRAM 1 — KRAKEN API CONNECTION ARCHITECTURE (Triple-Verified)</text>

  <!-- TothBot box -->
  <rect x="10" y="50" width="120" height="560" rx="4" fill="#D9E8FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="70" y="340" text-anchor="middle" fill="#1F3864" font-size="13" font-weight="bold" transform="rotate(-90,70,340)">TOTHBOT VPS</text>

  <!-- PUBLIC WS v2 -->
  <rect x="145" y="50" width="355" height="130" rx="4" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="322" y="70" text-anchor="middle" fill="#1B5E20" font-size="11" font-weight="bold">PUBLIC WS v2  wss://ws.kraken.com/v2</text>
  <text x="155" y="88" fill="#1B5E20" font-size="10">SUBSCRIBE: instrument | status | ohlc(5m) ★ SYSTEM CLOCK | ticker</text>
  <text x="155" y="104" fill="#1B5E20" font-size="10">ohlc fires on trade events — not wall clock (C-3)</text>
  <text x="155" y="120" fill="#1B5E20" font-size="10">ticker: event_trigger=trades (default) or bbo</text>
  <text x="155" y="136" fill="#1B5E20" font-size="10">instrument: qty_min, price_increment, pair status</text>
  <text x="155" y="152" fill="#1B5E20" font-size="10">status: 4 engine states — gates all order dispatch</text>

  <!-- PRIVATE WS v2 -->
  <rect x="145" y="192" width="355" height="195" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="322" y="212" text-anchor="middle" fill="#BF360C" font-size="11" font-weight="bold">PRIVATE WS v2  wss://ws-auth.kraken.com/v2</text>
  <text x="155" y="230" fill="#BF360C" font-size="10" font-weight="bold">INBOUND (push):</text>
  <text x="165" y="246" fill="#BF360C" font-size="10">executions — fills/expirations/SL-TP | ratecounter:true (A-1) | snap_orders on reconnect (A-3)</text>
  <text x="165" y="262" fill="#BF360C" font-size="10">balances — real-time on every settlement</text>
  <text x="155" y="280" fill="#BF360C" font-size="10" font-weight="bold">OUTBOUND (request):</text>
  <text x="165" y="296" fill="#BF360C" font-size="10">add_order — limit, post_only, GTD | req_id ★ | cl_ord_id ★(A-2) | stp_type:cancel-newest ★(A-4)</text>
  <text x="165" y="312" fill="#BF360C" font-size="10">batch_add — TP resting limit + emergSL stop-market | req_id ★ | OTO REJECTED — batch_add confirmed</text>
  <text x="165" y="328" fill="#BF360C" font-size="10">cancel_order — exit leg cleanup | req_id ★</text>
  <text x="165" y="344" fill="#BF360C" font-size="10">cancel_all_orders_after — DMS — EVALUATED AND REJECTED (cancels emergSL — defeats crash protection)</text>
  <text x="165" y="360" fill="#BF360C" font-size="10">ping — keepalive | req_id ★</text>
  <text x="155" y="376" fill="#BF360C" font-size="10">time_in / time_out on ALL responses — nanosecond precision (A-3 latency monitoring)</text>

  <!-- REST -->
  <rect x="145" y="398" width="355" height="105" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="322" y="418" text-anchor="middle" fill="#4A148C" font-size="11" font-weight="bold">REST  api.kraken.com/0/private  (startup + emergency only)</text>
  <text x="155" y="436" fill="#4A148C" font-size="10">GetWebSocketsToken — startup + every reconnect (token used within 15 min of creation)</text>
  <text x="155" y="452" fill="#4A148C" font-size="10">GetOpenOrders — restart reconciliation fallback (WS snap_orders preferred — A-3)</text>
  <text x="155" y="468" fill="#4A148C" font-size="10">GetAccountBalance — restart reconciliation</text>
  <text x="155" y="484" fill="#4A148C" font-size="10">CancelAllOrders — kill switch emergency only</text>
  <text x="155" y="500" fill="#4A148C" font-size="10">Auth: HMAC-SHA512(URI + SHA256(nonce + POST)) — UNCHANGED for Spot REST</text>

  <!-- Matching Engine -->
  <rect x="145" y="514" width="355" height="90" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="322" y="534" text-anchor="middle" fill="#B71C1C" font-size="11" font-weight="bold">KRAKEN MATCHING ENGINE — CRASH PROTECTION</text>
  <text x="155" y="552" fill="#B71C1C" font-size="10">Resting TP limit orders — survive any TothBot failure independently</text>
  <text x="155" y="568" fill="#B71C1C" font-size="10">Off-book emergency SL stop orders — survive any TothBot failure independently</text>
  <text x="155" y="584" fill="#B71C1C" font-size="10" font-weight="bold">★ MPP ALWAYS ENFORCED on triggered market orders — no override (C-1 dv1_4)</text>
  <text x="155" y="600" fill="#B71C1C" font-size="10">FIX cancel-on-disconnect: EVALUATED AND REJECTED — same as DMS, destroys crash protection</text>

  <!-- Kraken side boxes -->
  <!-- API Keys -->
  <rect x="515" y="50" width="200" height="80" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="615" y="70" text-anchor="middle" fill="#0D47A1" font-size="11" font-weight="bold">API KEY PAIRS</text>
  <text x="525" y="90" fill="#0D47A1" font-size="10">DATA key — market data subscriptions</text>
  <text x="525" y="106" fill="#0D47A1" font-size="10">TRADE key — orders + WS auth token</text>
  <text x="525" y="122" fill="#0D47A1" font-size="10">Nonce window: 10,000ms on both</text>

  <!-- Rate Limits -->
  <rect x="515" y="142" width="200" height="145" rx="4" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.5"/>
  <text x="615" y="162" text-anchor="middle" fill="#1A237E" font-size="11" font-weight="bold">RATE LIMITS — INTERMEDIATE TIER</text>
  <text x="525" y="180" fill="#1A237E" font-size="10">Threshold: 125/pair</text>
  <text x="525" y="196" fill="#1A237E" font-size="10">Decay: 2.34/sec</text>
  <text x="525" y="212" fill="#1A237E" font-size="10">Max open orders: 80/pair</text>
  <text x="525" y="228" fill="#1A237E" font-size="10">add_order: +1</text>
  <text x="525" y="244" fill="#1A237E" font-size="10">batch_add: +(n/2)</text>
  <text x="525" y="260" fill="#1A237E" font-size="10">cancel &lt;5s: +8  |  &lt;10s: +6  |  &lt;300s: +1</text>
  <text x="525" y="276" fill="#1A237E" font-size="10">Shared: REST + WS + FIX share same limit</text>

  <!-- Constraints -->
  <rect x="515" y="298" width="200" height="175" rx="4" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="615" y="318" text-anchor="middle" fill="#E65100" font-size="11" font-weight="bold">CONSTRAINTS</text>
  <text x="525" y="336" fill="#E65100" font-size="10">Cloudflare: 150 reconnects/10min/IP</text>
  <text x="525" y="352" fill="#E65100" font-size="10" font-weight="bold">★ Random drop: instant reconnect</text>
  <text x="535" y="368" fill="#E65100" font-size="10">  (handful of attempts) (A-5)</text>
  <text x="525" y="384" fill="#E65100" font-size="10" font-weight="bold">★ Maintenance: 5s minimum delay (A-5)</text>
  <text x="525" y="400" fill="#E65100" font-size="10">Keepalive: ping required (~60s timeout)</text>
  <text x="525" y="416" fill="#E65100" font-size="10">Token: fresh on every reconnect</text>
  <text x="525" y="432" fill="#E65100" font-size="10">SNI required for TLS (Cloudflare)</text>
  <text x="525" y="448" fill="#E65100" font-size="10">Max connections: Cloudflare enforced</text>
  <text x="525" y="464" fill="#E65100" font-size="10">L3 book on separate endpoint (ws-l3)</text>

  <!-- 4 Engine States -->
  <rect x="515" y="484" width="200" height="120" rx="4" fill="#E0F2F1" stroke="#00695C" stroke-width="1.5"/>
  <text x="615" y="504" text-anchor="middle" fill="#004D40" font-size="11" font-weight="bold">4 ENGINE STATES</text>
  <text x="525" y="522" fill="#004D40" font-size="10">online — all orders, normal operation</text>
  <text x="525" y="538" fill="#004D40" font-size="10">post_only — TothBot limit entries valid</text>
  <text x="525" y="554" fill="#004D40" font-size="10">cancel_only — cancels only, TP+SL active</text>
  <text x="525" y="570" fill="#004D40" font-size="10">maintenance — nothing, TP+SL stay active</text>
  <text x="525" y="586" fill="#004D40" font-size="10">status channel gates all order dispatch</text>

  <!-- Arrows -->
  <line x1="130" y1="115" x2="145" y2="115" stroke="#388E3C" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="290" x2="145" y2="290" stroke="#E65100" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="145" y1="340" x2="130" y2="340" stroke="#E65100" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="450" x2="145" y2="450" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="90" x2="515" y2="90" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="500" y1="215" x2="515" y2="215" stroke="#3949AB" stroke-width="1.5"/>
  <line x1="500" y1="386" x2="515" y2="386" stroke="#F9A825" stroke-width="1.5"/>
  <line x1="500" y1="534" x2="515" y2="534" stroke="#00695C" stroke-width="1.5"/>

  <!-- dv1_4 badge -->
  <rect x="795" y="608" width="95" height="22" rx="3" fill="#1F3864"/>
  <text x="842" y="623" text-anchor="middle" fill="#fff" font-size="10">0500000 dv1_4 ★</text>
</svg>